<!doctype html>

<title>Swatch — Delete Design?</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dimmed-bg">
  <div class="topnav">
    <a href="board.html" class="logo script">Swatch</a>
    <nav>
      <a href="board.html" class="active">Board</a>
      <a href="sets.html">Sets</a>
    </nav>
    <div class="user-chip"><div class="avatar">G</div> glossygigi</div>
  </div>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="script">Your Board</h1>
        <div class="subtitle">All your favorite nail inspo, saved in one place</div>
      </div>
    </div>
    <div class="masonry">
      <div class="pin"><div class="ph" style="--g: linear-gradient(150deg,#f6c9de,#f3e3c2); height:230px;"></div></div>
      <div class="pin"><div class="ph" style="--g: linear-gradient(150deg,#f9e4a8,#f6c9de); height:310px;"></div></div>

    </div>
  </div>
</div>

<div class="backdrop">
  <div class="modal">
    <div class="modal-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
    <h2>Delete this design?</h2>
    <p>This will remove it from your board permanently. This can't be undone.</p>
    <div class="modal-actions">
      <a href="board.html" class="btn btn-secondary">Cancel</a>
      <a href="board.html" class="btn btn-danger solid">Delete</a>
    </div>
  </div>
</div>

<div class="mockup-badge">Stage 1 · Static Mockup</div>
</body>
</html>
