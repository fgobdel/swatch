<!doctype html>
<html lang="en">
<head>

<title>Swatch — Delete Set?</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dimmed-bg">
  <div class="topnav">
    <a href="board.html" class="logo script">Swatch</a>
    <nav>
      <a href="board.html">Board</a>
      <a href="sets.html" class="active">Sets</a>
    </nav>
    <div class="user-chip"><div class="avatar">G</div> glossygigi</div>
  </div>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="script">Summer Vacay - July 2026</h1>
        <div class="subtitle">Edited 2 days ago · 8/10 nails filled</div>
      </div>
    </div>
    <div class="finger-row">
      <div class="slot-frame"><div class="ph" style="--g: linear-gradient(160deg,#f6c9de,#f3e3c2); height:100%;"></div></div>
      <div class="slot-frame"><div class="ph" style="--g: linear-gradient(160deg,#f9e4a8,#f6c9de); height:100%;"></div></div>
      <div class="slot-frame"><div class="ph" style="--g: linear-gradient(160deg,#e3c9f6,#f9e4a8); height:100%;"></div></div>
      <div class="slot-frame empty"><span class="plus">+</span></div>
      <div class="slot-frame"><div class="ph" style="--g: linear-gradient(160deg,#c9f6e0,#f6c9de); height:100%;"></div></div>
    </div>
  </div>
</div>

<div class="backdrop">
  <div class="modal">
    <div class="modal-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
    <h2>Delete this set?</h2>
    <p>"<span class="modal-target">Summer Vacay - July 2026</span>" and all 10 nail slots will be permanently deleted. Images already on your Board are not affected.</p>
    <div class="modal-actions">
      <a href="set-detail.html" class="btn btn-secondary">Cancel</a>
      <a href="sets.html" class="btn btn-danger solid">Delete Set</a>
    </div>
  </div>
</div>

<div class="mockup-badge">Stage 1 · Static Mockup</div>
</body>
</html>
