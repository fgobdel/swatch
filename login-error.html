<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatch — Log In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand script">Swatch</div>
    <div class="tagline">plan your next set, save what you love</div>

    <form action="board.html">
      <label for="username">Username</label>
      <input type="text" id="username" class="input-error" value="glossygigi">
      <div class="field-error">⚠ That username is already taken — try another.</div>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>

    <div class="login-foot">No password needed — new usernames are created automatically.<br>
      <a href="index.html" style="text-decoration:underline; color: var(--ink-faint);">← back to normal state</a>
    </div>
  </div>
</div>
<div class="mockup-badge">Stage 1 · Static Mockup</div>
</body>
</html>
