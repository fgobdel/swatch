<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatch — Crop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topnav">
  <a href="board.html" class="logo script">Swatch</a>
  <nav>
    <a href="board.html">Board</a>
    <a href="sets.html" class="active">Sets</a>
  </nav>
  <div class="user-chip"><div class="avatar">G</div> glossygigi</div>
</div>

<div class="crop-wrap">
  <div class="crop-target">Cropping for: Left Thumb 💅</div>
  <p style="margin-bottom:24px;">Pinch, drag, or use the slider to fit your photo into the nail-shaped frame.</p>

  <div class="crop-frame-outer">
    <div class="crop-frame">
      <div class="ph" style="--g: linear-gradient(150deg,#e3c9f6,#f9e4a8);"></div>
    </div>
    <div class="crop-controls">
      <span>🔍−</span>
      <input type="range" min="0" max="100" value="40">
      <span>🔍+</span>
    </div>
  </div>

  <div class="crop-footer">
    <a href="add-image-slot.html" class="btn btn-secondary">Cancel</a>
    <a href="set-detail.html" class="btn btn-primary">Save Crop</a>
  </div>
</div>

<div class="mockup-badge">Stage 1 · Static Mockup</div>
</body>
</html>
