<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatch — Log In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <!-- corner florals -->
  <svg class="corner-floral floral" style="top:6%;left:5%;width:110px;transform:rotate(-15deg);" viewBox="0 0 140 140" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 120C40 90 40 60 70 40"/>
    <path d="M45 75C35 70 28 72 22 82"/>
    <path d="M55 55C48 48 40 48 33 55"/>
    <g transform="translate(70 30) scale(0.55)">
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(72 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(144 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(216 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(288 60 60)"/>
      <circle cx="60" cy="60" r="6"/>
    </g>
  </svg>
  <svg class="corner-floral floral yellow" style="bottom:6%;right:6%;width:130px;transform:rotate(160deg);" viewBox="0 0 140 140" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 120C40 90 40 60 70 40"/>
    <path d="M45 75C35 70 28 72 22 82"/>
    <path d="M55 55C48 48 40 48 33 55"/>
    <g transform="translate(70 30) scale(0.55)">
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(72 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(144 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(216 60 60)"/>
      <path d="M60 60C48 46 48 26 60 12C72 26 72 46 60 60Z" transform="rotate(288 60 60)"/>
      <circle cx="60" cy="60" r="6"/>
    </g>
  </svg>

  <div class="card login-card">
    <div class="brand script">Swatch</div>
    <div class="tagline">plan your next set, save what you love</div>

    <form action="board.html">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g. glossygigi" value="">
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>

    <div class="login-foot">No password needed — new usernames are created automatically.<br>
      <a href="login-error.html" style="text-decoration:underline; color: var(--ink-faint);">preview: username taken →</a>
    </div>
  </div>
</div>

<div class="mockup-badge">Stage 1 · Static Mockup</div>
</body>
</html>
