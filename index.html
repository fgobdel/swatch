<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatch — Log In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <svg class="corner-floral floral" style="top:6%;left:5%;width:80px;transform:rotate(-15deg);" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="40" r="16"/>
    <circle cx="79" cy="54" r="16"/>
    <circle cx="72" cy="76" r="16"/>
    <circle cx="48" cy="76" r="16"/>
    <circle cx="41" cy="54" r="16"/>
    <circle cx="60" cy="60" r="9" fill="var(--flower-center, #fdf6ef)"/>
  </svg>
  <svg class="corner-floral floral yellow" style="bottom:6%;right:6%;width:95px;transform:rotate(160deg);" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="40" r="16"/>
    <circle cx="79" cy="54" r="16"/>
    <circle cx="72" cy="76" r="16"/>
    <circle cx="48" cy="76" r="16"/>
    <circle cx="41" cy="54" r="16"/>
    <circle cx="60" cy="60" r="9" fill="var(--flower-center, #fdf6ef)"/>
  </svg>

  <div class="card login-card">
    <div class="brand script">Swatch</div>
    <div class="tagline">plan your next set, save what you love</div>

    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g. glossygigi" autocomplete="off">

      <div id="secret-group" style="display:none;">
        <label for="secret" id="secret-label">Secret word</label>
        <input type="text" id="secret" placeholder="" autocomplete="off">
        <div style="text-align:left; margin-top:-8px;">
          <a href="#" id="back-link" style="font-size:0.78rem; color:var(--ink-faint); text-decoration:underline;">‹ different username</a>
        </div>
      </div>

      <div class="field-error" id="username-error" style="display:none;"></div>
      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Continue</button>
    </form>

    <div class="login-foot" id="login-hint">No password — just a username and a short secret word only you know.<br>First time? We'll help you set one up.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
