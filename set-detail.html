<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatch — Set</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topnav">
  <a href="board.html" class="logo script">Swatch</a>
  <nav>
    <a href="board.html">Board</a>
    <a href="sets.html" class="active">Sets</a>
  </nav>
  <div class="user-chip"><div class="avatar">G</div><span class="user-chip-name">…</span></div>
</div>

<div class="page">
  <a href="sets.html" class="back-link">‹ All Sets</a>

  <div id="detail-loading" style="color:var(--ink-faint); padding:20px 0;">Loading set…</div>

  <div id="detail-content" style="display:none;">
    <div class="page-header">
      <div>
        <div class="set-title-edit">
          <input type="text" id="set-name" class="script" style="border:none; background:transparent; font-size:2.6rem; padding:0; width:100%;" placeholder="Untitled Set">
          <button id="fav-btn" class="star-btn" title="Favorite">☆</button>
        </div>
        <div class="subtitle" id="filled-count"></div>
      </div>
      <div class="header-actions">
        <button id="export-btn" class="btn btn-secondary">⇩ Export</button>
        <button id="duplicate-btn" class="btn btn-secondary">⧉ Duplicate</button>
        <button id="delete-btn" class="btn btn-danger">Delete Set</button>
      </div>
    </div>

    <div class="notes-box">
      <label>Notes</label>
      <textarea id="set-notes" rows="2" placeholder="e.g. ask for gel not acrylic"></textarea>
    </div>

    <div class="hand-label">🖐 Left Hand</div>
    <div class="finger-row" id="left-row"></div>

    <div class="hand-label">🖐 Right Hand</div>
    <div class="finger-row" id="right-row"></div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="backdrop" id="delete-modal" style="display:none;">
  <div class="modal">
    <div class="modal-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
    <h2>Delete this set?</h2>
    <p>"<span class="modal-target" id="delete-target-name"></span>" and all 10 nail slots will be permanently deleted. Images already on your Board are not affected.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
      <button class="btn btn-danger solid" id="delete-confirm">Delete Set</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/crop-tool.js"></script>
<script src="js/export.js"></script>
<script src="js/pages/set-detail.js"></script>
</body>
</html>
